name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test:unit

  integration:
    runs-on: ubuntu-latest
    # The gate that was missing all along: integrationtests/** is excluded from
    # both tsconfig and test:unit, so without this job a broken integration
    # test ships green. Runs real backends via testcontainers.
    #
    # ONE RUNNER PER SUITE. Six container suites in one 2-core job starved each
    # other, and grpc-js's process-wide subchannel pool handed a later container
    # on a reused port an earlier one's dead session. Both are fixed at the
    # source (per-channel pools, heartbeats answered); the matrix keeps each
    # suite on its own machine and gives a failure a name.
    strategy:
      fail-fast: false
      matrix:
        suite:
          - packages/postgres/src/__tests__
          - packages/rabbitmq/src/__tests__
          - packages/kronosdb/src/__tests__
          - packages/axon-server/src/__tests__
          - integrationtests/src/__tests__
          - integrationtests/src/axon-e2e
    name: integration (${{ matrix.suite }})
    permissions:
      contents: read
      packages: read   # ghcr.io/kronosdb/kronosdb image pull
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Log in to GHCR (kronosdb image)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - run: bun install --frozen-lockfile

      - name: Container tests
        run: bun test ${{ matrix.suite }}
        timeout-minutes: 20

