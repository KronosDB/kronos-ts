name: CI

on:
  workflow_call:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Messaging test typecheck
        run: bun run typecheck:messaging-tests

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test:unit

  integration:
    runs-on: ubuntu-latest
    # Every integration family is gated. Each test file runs in a fresh
    # process, including nested wire traffic, burst load and connection loss.
    # Keep backend groups independent so JVM/broker startup cannot starve
    # unrelated suites on the same runner.
    strategy:
      fail-fast: false
      matrix:
        suite:
          - packages/core/src
          - packages/postgres/src/__tests__
          - packages/rabbitmq/src/__tests__
          - packages/kronosdb/src/__tests__
          - packages/axon-server/src/__tests__
          - integrationtests/src/__tests__
          - integrationtests/src/axon-e2e
    name: integration (${{ matrix.suite }})
    permissions:
      contents: read
      packages: read   # ghcr.io/kronosdb/kronosdb image pull
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Log in to GHCR (kronosdb image)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - run: bun install --frozen-lockfile

      - name: Container tests
        run: bun run scripts/run-test-suites.ts ${{ matrix.suite }}
        timeout-minutes: 20

