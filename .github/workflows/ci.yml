name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test:unit

  integration:
    runs-on: ubuntu-latest
    # The gate that was missing all along: integrationtests/** is excluded from
    # both tsconfig and test:unit, so without this job a broken integration
    # test ships green. Runs real backends via testcontainers.
    permissions:
      contents: read
      packages: read   # ghcr.io/kronosdb/kronosdb image pull
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Log in to GHCR (kronosdb image)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - run: bun install --frozen-lockfile

      # Package-level container suites. `test:unit` filters *.integration.test.ts
      # out, and the cross-package job below only globs integrationtests/ — so
      # without this step a broken postgres or RabbitMQ adapter ships green.
      - name: Container tests (per package)
        run: >
          bun test
          packages/postgres/src/__tests__
          packages/rabbitmq/src/__tests__
          packages/kronosdb/src/__tests__
          packages/axon-server/src/__tests__
        timeout-minutes: 15

      - name: Integration tests (live postgres, RabbitMQ, Axon Server, KronosDB)
        run: bun test integrationtests
        timeout-minutes: 15
