name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm Trusted Publishing (OIDC) — no token needed

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # npm itself does the publish (via `changeset publish`). Trusted
      # Publishing needs npm >= 11.5.1, newer than what runners ship.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      # Opens/updates a "Version Packages" PR while changesets are pending,
      # and publishes to npm once that PR is merged to main. Publishing
      # authenticates via OIDC — no NPM_TOKEN secret.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
