name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify:
    # Run the same complete CI on this push SHA. Publication cannot start
    # when a unit/type/build check or any integration matrix entry fails.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # npm itself does the publish (via scripts/publish.sh). Trusted
      # Publishing needs npm >= 11.5.1, newer than what runners ship.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      # Opens/updates a "Version Packages" PR while changesets are pending,
      # and publishes to npm once that PR is merged to main. Publishing
      # authenticates via OIDC — no NPM_TOKEN secret.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
